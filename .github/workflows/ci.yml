name: Homebrew CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tap repository
        run: brew tap tcballard/tap "$GITHUB_WORKSPACE"

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax
