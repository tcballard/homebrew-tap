name: Homebrew CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tap repository
        run: brew tap tcballard/tap "$GITHUB_WORKSPACE"

      - name: Check package definitions
        shell: bash
        run: |
          found=false
          while IFS= read -r -d '' file; do
            found=true
            ruby -c "$file"
            brew style "$file"
          done < <(find Casks Formula -type f -name '*.rb' -print0)

          if [[ "$found" == false ]]; then
            echo "No formulae or casks to validate yet."
          fi
